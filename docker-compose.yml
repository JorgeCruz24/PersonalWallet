services:
  postgres:
    image: postgres:17
    container_name: personal-wallet-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_password
      POSTGRES_DB: personal_wallet

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: